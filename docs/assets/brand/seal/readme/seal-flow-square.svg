<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" font-family="'Space Grotesk',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E1B5E"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
  </defs>
  <rect width="1000" height="1000" fill="#F7F7FA"/>
  <rect x="20" y="20" width="960" height="420" rx="36" fill="#ECEBF6" stroke="#1E1B5E" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="60" y="76" font-size="24" font-weight="700" letter-spacing="3" fill="#1E1B5E">PRIVATE · YOUR DEVICE</text>
  <rect x="60" y="110" width="250" height="150" rx="26" fill="#FFF" stroke="#1E1B5E" stroke-width="4"/>
  <text x="185" y="175" text-anchor="middle" font-size="36" font-weight="700" fill="#14123A">You</text>
  <text x="185" y="218" text-anchor="middle" font-size="24" fill="#5B5A78">on iMessage</text>
  <rect x="375" y="110" width="250" height="150" rx="26" fill="#FFF" stroke="#1E1B5E" stroke-width="4"/>
  <text x="500" y="168" text-anchor="middle" font-size="34" font-weight="700" fill="#14123A">Seal agent</text>
  <text x="500" y="208" text-anchor="middle" font-size="22" fill="#5B5A78">memory text</text>
  <text x="500" y="238" text-anchor="middle" font-size="22" fill="#5B5A78">owner secret</text>
  <rect x="690" y="110" width="250" height="150" rx="26" fill="#FFF" stroke="#1E1B5E" stroke-width="4"/>
  <text x="815" y="175" text-anchor="middle" font-size="32" font-weight="700" fill="#14123A">Proof server</text>
  <text x="815" y="218" text-anchor="middle" font-size="22" fill="#5B5A78">builds ZK proof</text>
  <line x1="312" y1="185" x2="370" y2="185" stroke="#1E1B5E" stroke-width="5" marker-end="url(#a)"/>
  <line x1="627" y1="185" x2="685" y2="185" stroke="#1E1B5E" stroke-width="5" marker-end="url(#a)"/>
  <rect x="375" y="300" width="250" height="100" rx="22" fill="#FFF4EC" stroke="#C2410C" stroke-width="4"/>
  <text x="500" y="345" text-anchor="middle" font-size="28" font-weight="700" fill="#C2410C">Spend gate</text>
  <text x="500" y="380" text-anchor="middle" font-size="20" fill="#C2410C">fails closed</text>
  <line x1="500" y1="262" x2="500" y2="295" stroke="#C2410C" stroke-width="4"/>
  <!-- down arrows -->
  <line x1="815" y1="262" x2="815" y2="520" stroke="#1E1B5E" stroke-width="5" marker-end="url(#a)"/>
  <text x="830" y="480" font-size="22" font-weight="700" fill="#1E1B5E">proof + tx</text>
  <line x1="500" y1="402" x2="500" y2="520" stroke="#C2410C" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#r)"/>
  <text x="515" y="480" font-size="22" font-weight="700" fill="#C2410C">check limit</text>
  <!-- public -->
  <rect x="20" y="530" width="960" height="300" rx="36" fill="#1E1B5E"/>
  <text x="60" y="586" font-size="24" font-weight="700" letter-spacing="3" fill="#C9C7F2">PUBLIC · MIDNIGHT LEDGER</text>
  <rect x="60" y="615" width="420" height="185" rx="22" fill="#2A2775"/>
  <text x="85" y="660" font-size="26" font-weight="700" fill="#FFF">memory-vault</text>
  <text x="85" y="700" font-size="22" fill="#DAD9F7">commitments</text>
  <text x="85" y="732" font-size="22" fill="#DAD9F7">category code on attest</text>
  <text x="85" y="764" font-size="22" fill="#DAD9F7">nullifiers, no replay</text>
  <rect x="520" y="615" width="420" height="185" rx="22" fill="#2A2775"/>
  <text x="545" y="660" font-size="26" font-weight="700" fill="#FFF">allowance-registry</text>
  <text x="545" y="700" font-size="22" fill="#DAD9F7">owner-bound limits</text>
  <text x="545" y="732" font-size="22" fill="#DAD9F7">running total</text>
  <text x="545" y="764" font-size="22" fill="#DAD9F7">overspend can't prove</text>
  <!-- verifier -->
  <rect x="250" y="880" width="500" height="100" rx="26" fill="#FFF" stroke="#1E1B5E" stroke-width="4"/>
  <text x="500" y="925" text-anchor="middle" font-size="30" font-weight="700" fill="#14123A">Anyone can verify</text>
  <text x="500" y="960" text-anchor="middle" font-size="21" fill="#5B5A78">reads the ledger, no wallet needed</text>
  <line x1="500" y1="876" x2="500" y2="836" stroke="#1E1B5E" stroke-width="5" marker-end="url(#a)"/>
</svg>
